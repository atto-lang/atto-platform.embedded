# Experimental Zephyr 4.3.0 Arduino UNO R4 Minima compatibility overlay.
#
# Existing Oreslang thumbv7m-none-eabi guest object uses the ARM AAPCS32
# soft-float calling convention. The UNO R4's Zephyr default uses hard-float,
# which GNU ld correctly rejects when linking the guest.
#
# Selecting soft-ABI permits linking the current integer-only guest subset.
# Zephyr 4.3.0 only emits an explicit .ARM.extab ROM linker section when
# CONFIG_CPP or CONFIG_RUST is enabled; use CPP here to avoid the existing
# orphan .ARM.extab falling into Renesas OFS option-setting memory.
#
# This is a linker compatibility workaround, not evidence that native M4
# hard-float codegen, C++ features, physical boot, IRQ safety or real-time
# properties are supported. It is deliberately opt-in, not prj.conf default.
CONFIG_FP_SOFTABI=y
CONFIG_CPP=y
